<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>معاينة العناصر — بدون محرر</title>
    <style>
      :root {
        --page-bg: #f6f0ea;
        --ink: #2c1810;
        --muted: #7a5c4e;
        --card: #fffdfb;
        --line: rgba(80, 50, 35, 0.12);
        --accent: #8b5e4b;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background:
          radial-gradient(1200px 500px at 10% -10%, rgba(201, 166, 107, 0.14), transparent 55%),
          radial-gradient(900px 420px at 100% 0%, rgba(139, 94, 75, 0.12), transparent 50%),
          var(--page-bg);
        color: var(--ink);
        font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem 1.25rem;
        backdrop-filter: blur(10px);
        background: rgba(246, 240, 234, 0.9);
        border-bottom: 1px solid var(--line);
      }
      .topbar h1 { margin: 0; font-size: 1.05rem; font-weight: 800; }
      .topbar p { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.82rem; }
      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        max-width: 58%;
        justify-content: flex-end;
      }
      .nav a {
        text-decoration: none;
        color: var(--ink);
        font-size: 0.72rem;
        padding: 0.35rem 0.55rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        white-space: nowrap;
      }
      .nav a:hover { border-color: var(--accent); color: var(--accent); }
      .stage { width: min(1600px, 100%); margin: 0 auto; padding: 1.25rem; }
      .component-card {
        margin: 0 0 2rem;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(70, 40, 30, 0.06);
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem 1.15rem;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #fff, #fbf6f2);
      }
      .card-head h2 { margin: 0; font-size: 1rem; font-weight: 800; }
      .card-head code { font-size: 0.72rem; color: var(--muted); }
      .frame {
        width: 1600px;
        max-width: 100%;
        min-height: 1200px;
        margin: 0 auto;
        padding: 1.25rem;
        background: #fff;
      }
      .solo .component-card { display: none; }
      .solo .component-card.is-solo { display: block; }
      .solo .topbar .nav { display: none; }
      .solo .stage { padding-top: 0.5rem; }
      .solo .card-head { display: none; }
      .solo .frame { min-height: 1200px; height: 1200px; overflow: hidden; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>معاينة عناصر الأزياء والموضة</h1>
        <p>وضع عرض نظيف بدون محرر الإعدادات — مناسب للقطات والـ WebP المتحرك</p>
      </div>
      <nav class="nav" id="nav"></nav>
    </header>
    <main class="stage" id="stage"></main>
    <script type="module">
      // Preview-only: Salla's runtime normally provides this static registrar.
      if (!HTMLElement.registerSallaComponent) {
        HTMLElement.registerSallaComponent = function (tag) {
          if (!customElements.get(tag)) customElements.define(tag, this);
        };
      }

      const COMPONENTS = [
        ['abaya-length-calculator', 'حاسبة طول العباية'],
        ['abaya-care-assistant', 'مساعد العناية بالعباية'],
        ['abaya-fabric-lab', 'مختبر أقمشة العبايات'],
        ['abaya-style-duel', 'تحدي العبايات'],
        ['abaya-style-swipe', 'اكتشفي ذوقك'],
        ['collection-reveal', 'إطلاق المجموعة الجديدة'],
        ['virtual-abaya-boutique', 'بوتيك العبايات التفاعلي'],
        ['abaya-comparison-arena', 'مقارنة العبايات'],
        ['abaya-look-builder', 'منسقة الإطلالة'],
        ['abaya-configurator', 'مصممة العباية التفاعلية'],
        ['echo-salon', 'رواق الشهادات'],
        ['silhouette-fit-ritual', 'طقوس القياس'],
        ['inquiry-parlour', 'ديوان الأسئلة'],
        ['abaya-motion-mirror', 'مرآة حركة العباية'],
        ['abaya-light-studio', 'استوديو الإضاءة والخامة'],
        ['abaya-embroidery-map', 'خريطة تطريز العباية'],
        ['shine-videos', 'تألقي'],
        ['new-arrivals-lookbook', 'وصل حديثا'],
        ['style-categories', 'تصنيفات الأزياء'],
        ['style-before-after', 'قبل وبعد'],
        ['style-promo-banners', 'البنرات الترويجية'],
      ];

      function buildDefaults(raw) {
        const data = {};
        if (!raw?.fields) return data;
        for (const field of raw.fields) {
          if (!field?.id || field.type === 'static') continue;
          if (String(field.id).startsWith('static-')) continue;
          if (field.type === 'collection') {
            data[field.id] = Array.isArray(field.value) ? field.value : [];
            continue;
          }
          if (field.format === 'dropdown-list' && Array.isArray(field.selected) && field.selected[0]) {
            const pick = field.selected[0];
            data[field.id] =
              pick && typeof pick === 'object' ? pick.value ?? pick.key ?? pick : pick;
            continue;
          }
          if (typeof field.value !== 'undefined') data[field.id] = field.value;
        }
        return data;
      }

      const params = new URLSearchParams(location.search);
      const only = params.get('component');
      if (only) document.body.classList.add('solo');

      const bundle = await fetch('/twilight-bundle.json').then((r) => r.json());
      const byName = Object.fromEntries((bundle.components || []).map((c) => [c.name, c]));

      const nav = document.getElementById('nav');
      const stage = document.getElementById('stage');

      for (const [name, title] of COMPONENTS) {
        if (only && only !== name) continue;
        const a = document.createElement('a');
        a.href = `#${name}`;
        a.textContent = title;
        nav.appendChild(a);

        const card = document.createElement('section');
        card.className = 'component-card' + (only === name ? ' is-solo' : '');
        card.id = name;
        card.setAttribute('data-component', name);
        card.innerHTML = `
          <div class="card-head">
            <h2>${title}</h2>
            <code>${name}</code>
          </div>
          <div class="frame"></div>
        `;
        stage.appendChild(card);

        await import(`/src/components/${name}/index.ts`);
        const tag = `salla-${name}`;
        const el = document.createElement(tag);
        el.config = buildDefaults(byName[name]);
        card.querySelector('.frame').appendChild(el);
      }
    </script>
  </body>
</html>
